# El free tier de Render duerme el servicio tras 15 min sin tráfico. Un ping
# cada 10 min lo mantiene despierto (750 h gratis/mes alcanzan para 24/7).
name: keep-lead-agent-warm
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://volt-lead-agent.onrender.com/health
