name: Scraper Inmuebles24

on:
  # Corre cada 6 horas
  schedule:
    - cron: "0 */6 * * *"
  # También se puede disparar manualmente desde GitHub UI
  workflow_dispatch:
    inputs:
      zona:
        description: "Zona específica (dejar vacío para todas)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (sin escribir a DB)"
        type: boolean
        required: false
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.zona }}" ]; then
            ARGS="$ARGS --zona ${{ github.event.inputs.zona }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          npm run scrape -- $ARGS
